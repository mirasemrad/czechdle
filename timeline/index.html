<!doctype html>
<html lang="cs" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline — česká historie na časové ose | Czechdle</title>
    <meta
      name="description"
      content="Doplň časovou osu českých a světových událostí. 5 daných karet, 5 tvých — denní historický kvíz zdarma."
    />
    <link rel="canonical" href="https://czechdle.vercel.app/timeline/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:site_name" content="Czechdle" />
    <meta property="og:url" content="https://czechdle.vercel.app/timeline/" />
    <meta
      property="og:title"
      content="Timeline — česká historie na časové ose | Czechdle"
    />
    <meta
      property="og:description"
      content="Doplň časovou osu. Denní historický kvíz o Česku i světě."
    />
    <script>
      try {
        var t = localStorage.getItem('ceska-geografie:theme')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@600&family=Outfit:wght@400;500;600;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/timeline-bg.jpg" fetchpriority="high" />
    <style>
      html, body { background: #070d14; margin: 0; min-height: 100%; }
      .scene-bg {
        position: fixed; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: center; pointer-events: none;
        z-index: 0; opacity: 0; transition: opacity 0.28s ease;
      }
      .scene-bg.is-ready { opacity: 1; }
      #app { position: relative; z-index: 1; min-height: 100%; opacity: 0; }
      #app.is-ready { animation: app-in 0.28s ease both; }
      @keyframes app-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body class="game-page pixel-theme game-timeline">
    <img
      class="scene-bg"
      src="/timeline-bg.jpg"
      width="1600"
      height="893"
      alt=""
      decoding="async"
      fetchpriority="high"
      onload="this.classList.add('is-ready')"
    />
    <div id="app"></div>
    <script type="module" src="/src/games/timeline/main.ts"></script>
  </body>
</html>
